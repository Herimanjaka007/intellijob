services:
  postgres:
    image: postgres:16-alpine
    container_name: intellijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellijob_user
      POSTGRES_PASSWORD: intellijob_password
      POSTGRES_DB: intellijob
    ports:
      # 5433 : port hôte alternatif pour éviter le conflit avec un PostgreSQL
      # natif installé sur la machine hôte (souvent en écoute sur 5432).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellijob_user -d intellijob"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: intellijob-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intellijob_minio_user
      MINIO_ROOT_PASSWORD: intellijob_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: intellijob-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 intellijob_minio_user intellijob_minio_password;
      mc mb --ignore-existing local/raw-documents;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
