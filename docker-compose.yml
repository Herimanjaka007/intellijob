services:
  postgres:
    image: postgres:16-alpine
    container_name: intellijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellijob_user
      POSTGRES_PASSWORD: intellijob_password
      POSTGRES_DB: intellijob
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellijob_user -d intellijob"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: intellijob-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intellijob_minio_user
      MINIO_ROOT_PASSWORD: intellijob_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
